<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ece6d8">
<title>JoJo Habits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ece6d8;--paper:#f3eee3;--card:#fff;--ink:#111;--purple:#7a2bd8;
  --text:#111;--text-2:#4a4640;--text-3:#8a857a;--border:#111;--red:#d33a22;--green:#7a2bd8;
  --s1:#fff;--s2:#f3eee3;--gold:#7a2bd8;--gold-l:#7a2bd8;--purple-l:#7a2bd8;--teal-l:#7a2bd8;
  --b:3px solid #111;--sh:6px 6px 0 #111;
  --dotp:radial-gradient(rgba(17,17,17,.5) 1.2px,transparent 1.5px) 0 0/6px 6px,#7a2bd8;
  --dotc:radial-gradient(rgba(17,17,17,.5) 1.1px,transparent 1.4px) 0 0/7px 7px,#f6f2e8;
  --display:'Anton','Impact','Arial Narrow',sans-serif;
  --body:'Space Grotesk',system-ui,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--bg);}
body{font-family:var(--body);background-color:var(--bg);background-image:radial-gradient(rgba(17,17,17,.2) 1.1px,transparent 1.4px);background-size:7px 7px;color:var(--ink);min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
button{font-family:var(--body);color:inherit;}
input{font-family:var(--body);color:var(--ink);}
input[type=number]{-moz-appearance:textfield;appearance:textfield;}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
main{max-width:480px;margin:0 auto;padding:calc(26px + env(safe-area-inset-top)) 20px calc(140px + env(safe-area-inset-bottom));position:relative;}
.panel{display:none;}.panel.active{display:block;}

/* ---------- Tipografía y encabezados ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;margin-bottom:2px;}
.display{font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:.88;letter-spacing:-.005em;}
.h-xl{font-size:clamp(88px,27vw,116px);}
.h-lg{font-size:clamp(58px,18vw,78px);}
.h-md{font-size:clamp(48px,14.5vw,62px);}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;position:relative;}
.hero{position:relative;margin-bottom:22px;}
.sfx{position:absolute;font-family:'Noto Sans JP',sans-serif;font-weight:900;color:var(--purple);pointer-events:none;white-space:nowrap;z-index:3;line-height:1;}
.sfx span{display:inline-block;}
.sfx span:nth-child(1){transform:rotate(-10deg);}
.sfx span:nth-child(2){transform:translateY(10px) rotate(4deg);}
.sfx span:nth-child(3){transform:translateY(22px) rotate(-6deg);}
.sfx.hoy{right:-18px;top:62px;font-size:60px;}
.sfx.stats{right:0;top:4px;font-size:52px;}
.pills{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.pill{font-weight:700;letter-spacing:.14em;font-size:13px;text-transform:uppercase;padding:9px 14px;border:3px solid var(--ink);background:transparent;}
.pill.solid{background:var(--ink);color:var(--paper);}
.section-h{font-family:var(--display);font-weight:400;font-size:36px;text-transform:uppercase;margin:34px 0 16px;line-height:1;}

/* ---------- Tarjetas ---------- */
.card{background:var(--card);border:var(--b);box-shadow:var(--sh);padding:20px 18px;margin-bottom:22px;position:relative;}
.card.cream{background:var(--paper);}
.card-title{font-family:var(--display);font-weight:400;font-size:28px;text-transform:uppercase;letter-spacing:.005em;line-height:1;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.card-title .icon{display:none;}
.card-subtitle{font-size:12px;color:var(--text-2);margin:-8px 0 14px;line-height:1.5;font-weight:500;}
.k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
.foot{font-size:11px;font-weight:500;color:var(--text-2);margin-top:14px;line-height:1.5;}
.acc{color:var(--purple);}
.empty-note{text-align:center;font-weight:700;letter-spacing:.06em;font-size:14px;padding:34px 20px;text-transform:uppercase;}

/* ---------- Hoy ---------- */
.hoy-sleep{transform:rotate(-.5deg);padding:22px 20px 20px;}
.hoy-sleep .row-top{display:flex;justify-content:space-between;align-items:baseline;}
.meta-tag{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
.sleep-line{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px;}
.big-num{font-family:var(--display);font-size:84px;line-height:1;width:122px;border:0;background:transparent;outline:none;padding:0;color:var(--ink);border-radius:0;}
.big-num::placeholder{color:#c9c3b4;}
.big-unit{font-size:20px;font-weight:700;}
.prog-track{height:20px;border:3px solid var(--ink);background:#fff;overflow:hidden;}
.prog-fill{height:100%;background:var(--dotp);transition:width .5s cubic-bezier(.4,0,.2,1);width:0;}
.tiles-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;margin-bottom:22px;}
.tile{padding:18px 16px;border:var(--b);box-shadow:var(--sh);}
.tile-title{font-family:var(--display);font-size:26px;text-transform:uppercase;line-height:1;margin-bottom:10px;}
.tile-water{background:var(--ink);color:var(--paper);transform:rotate(-.8deg);display:flex;flex-direction:column;}
.water-num{font-family:var(--display);font-size:56px;line-height:1;display:flex;align-items:baseline;gap:6px;}
.water-num small{font-family:var(--display);font-size:22px;}
.tile-water .prog-track{background:var(--ink);border-color:var(--paper);height:14px;margin:12px 0;}
.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.quick-btn{background:var(--paper);border:0;color:var(--ink);font-weight:700;font-size:16px;padding:13px 4px;cursor:pointer;transform:rotate(-1.2deg);}
.quick-btn:nth-child(2n){transform:rotate(1.2deg);}
.quick-btn:active{transform:scale(.95);}
.mini-link{margin-top:10px;background:none;border:0;color:var(--paper);opacity:.7;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;text-align:left;padding:4px 0;}
.tile-train{background:#fff;color:var(--ink);transform:rotate(1deg);display:flex;flex-direction:column;}
.tile-train.on{background:var(--purple);color:var(--paper);}
.tile-main{background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;flex:1;padding:0;}
.check{flex:1;display:flex;align-items:center;min-height:70px;}
.check svg{width:70px;height:70px;opacity:.13;}
.tile-train.on .check svg{opacity:1;}
.tile-status{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
.doblete-btn{margin-top:12px;border:3px solid currentColor;background:transparent;color:inherit;font-size:12px;font-weight:700;letter-spacing:.14em;padding:9px 6px;cursor:pointer;text-transform:uppercase;width:100%;}
.doblete-btn.on{background:var(--paper);color:var(--ink);border-color:var(--ink);}
.next-card{border:3px dashed var(--ink);background:rgba(255,255,255,.7);padding:26px 22px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:18px;cursor:pointer;width:100%;text-align:left;}
.next-card .arrow{font-size:26px;}

/* ---------- Medidor ---------- */
.weight-tag{background:var(--ink);color:var(--paper);padding:12px 16px 10px;transform:rotate(-2deg);text-align:right;min-width:150px;box-shadow:4px 4px 0 rgba(17,17,17,.25);}
.weight-row{display:flex;align-items:baseline;justify-content:flex-end;gap:4px;}
.weight-input{font-family:var(--display);font-size:46px;line-height:1;width:112px;text-align:right;background:transparent;border:0;outline:none;color:var(--paper);padding:0;border-radius:0;}
.weight-input::placeholder{color:#6b665c;}
.weight-unit{font-family:var(--display);font-size:20px;}
.weight-delta{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:2px;}
.body-card{padding:14px 12px 16px;}
.body-cols{display:grid;grid-template-columns:1fr 118px 1fr;gap:6px;align-items:start;}
.figure{width:118px;height:auto;display:block;margin-top:6px;}
.mcol{display:flex;flex-direction:column;}
.mcol.pad{padding-top:50px;}
.mgap1{margin-top:24px;}.mgap2{margin-top:20px;}
.mcard{display:block;background:var(--paper);border:3px solid var(--ink);padding:7px 8px 8px;cursor:text;min-width:0;}
.mcard + .mcard{border-top-width:0;}
.mcard.single{border-top-width:3px;}
.mlabel{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;margin-bottom:2px;}
.mrow{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;}
.mcard input,.mini input{font-family:var(--display);font-size:26px;line-height:1.05;width:62%;background:transparent;border:0;outline:none;padding:0;border-radius:0;color:var(--ink);}
.mcard input::placeholder,.mini input::placeholder{color:#b8b2a2;}
.mdelta{font-size:11px;font-weight:700;color:var(--ink);}
.mdelta.up{color:var(--purple);}
.mcard.empty{background:var(--purple);color:var(--paper);}
.mcard.empty .mlabel{color:var(--paper);}
.mcard.empty input{width:100%;color:var(--paper);}
.mcard.empty input::placeholder{color:var(--paper);opacity:1;}
.mcard.empty .mdelta{color:var(--paper);opacity:.85;font-weight:500;}
.mini-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:18px;}
.mini{display:block;background:#fff;border:3px solid var(--ink);padding:7px 4px 6px;text-align:center;cursor:text;min-width:0;}
.mini .mlabel{font-size:9px;letter-spacing:.03em;}
.mini input{width:100%;text-align:center;font-size:21px;}
.mini .mdelta{display:block;font-size:10px;min-height:12px;}
.mini.empty{background:var(--purple);color:var(--paper);}
.mini.empty .mlabel,.mini.empty input,.mini.empty .mdelta{color:var(--paper);}
.mini.empty input::placeholder{color:var(--paper);opacity:1;}
.med-count{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--text-2);margin-bottom:14px;}

/* ---------- Botones ---------- */
.save-btn,.config-btn{width:100%;padding:16px;background:var(--ink);color:var(--paper);border:3px solid var(--ink);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;box-shadow:5px 5px 0 var(--purple);margin-bottom:12px;transition:transform .1s,box-shadow .1s;}
.save-btn:active,.config-btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--purple);}
.save-btn:disabled{opacity:.4;}
.reset-btn,.link-btn{background:transparent;border:3px solid var(--ink);color:var(--ink);padding:8px 12px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;}
.link-btn{width:100%;padding:12px;margin-bottom:12px;}
.sq-btn{width:54px;height:54px;background:#fff;border:3px solid var(--ink);font-size:24px;font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--ink);}
.sq-btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink);}
.nav-btns{display:flex;gap:12px;margin-top:6px;}

/* ---------- Stats ---------- */
.stat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px;}
.stile{padding:16px 16px 14px;border:var(--b);box-shadow:var(--sh);}
.stile.black{background:var(--ink);color:var(--paper);transform:rotate(-.8deg);}
.stile.white{background:#fff;transform:rotate(.6deg);}
.stile .big{white-space:nowrap;font-family:var(--display);font-size:52px;line-height:1.05;margin:6px 0 4px;}
.stile .sub{font-size:13px;font-weight:500;}
.comp-bar{display:flex;border:3px solid var(--ink);height:40px;margin-bottom:16px;background:var(--ink);}
.comp-lean{background:var(--ink);color:var(--paper);display:flex;align-items:center;padding-left:12px;font-size:12px;font-weight:700;letter-spacing:.06em;white-space:nowrap;overflow:hidden;}
.comp-fat{background:var(--dotp);}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.trio .v{font-family:var(--display);font-size:32px;line-height:1.1;margin-top:4px;}
.chart-wrap{position:relative;}
.chart{position:relative;height:150px;display:flex;gap:10px;align-items:flex-end;border-bottom:3px solid var(--ink);padding:0 2px;}
.goal-line{position:absolute;left:0;right:0;bottom:80%;border-top:3px dashed var(--ink);pointer-events:none;}
.bar{flex:1;border:3px solid var(--ink);border-bottom:0;background:var(--dotc);min-height:0;}
.bar.goal{background:var(--dotp);}
.bar.none{border:0;height:0 !important;}
.bar-lbls{display:flex;gap:10px;padding:0 2px;margin-top:10px;}
.bar-lbls div{flex:1;text-align:center;font-weight:700;font-size:15px;}
.mt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.mt{background:var(--paper);border:3px solid var(--ink);padding:8px 6px;text-align:center;}
.mt .k{font-size:9px;letter-spacing:.06em;}
.mt .v{font-family:var(--display);font-size:24px;line-height:1.1;margin-top:3px;}

/* ---------- Análisis ---------- */
.ratio-card{background:#fff;border:3px solid var(--ink);box-shadow:0 0 0 6px var(--purple),0 0 0 9px var(--ink),12px 12px 0 9px var(--ink);margin:14px 10px 30px;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;}
.ratio-card .num{font-family:var(--display);font-size:78px;line-height:1;margin-top:4px;}
.ratio-side{text-align:right;font-weight:700;font-size:16px;line-height:1.5;padding-bottom:8px;}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:34px 28px 34px 34px;padding:20px 22px 18px;margin-bottom:30px;transform:rotate(-.4deg);}
.bubble.alt{transform:rotate(.4deg);border-radius:34px 34px 28px 34px;}
.bubble::after{content:'';position:absolute;bottom:-17px;left:84px;width:28px;height:28px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(12deg,12deg);}
.bubble.alt::after{left:auto;right:70px;}
.bubble h3{font-family:var(--display);font-weight:400;font-size:30px;text-transform:uppercase;line-height:1;margin-bottom:8px;}
.bubble p{font-size:17px;line-height:1.45;font-weight:500;}
.mission{background:var(--ink);color:var(--paper);padding:18px 18px 20px;display:flex;gap:14px;align-items:flex-start;margin-bottom:10px;}
.mission .bang{font-family:var(--display);font-size:56px;line-height:.9;color:var(--purple);}
.mission .k{letter-spacing:.2em;margin-bottom:6px;}
.mission p{font-size:19px;line-height:1.35;font-weight:500;}
.comp-visual{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.comp-item{background:var(--paper);border:3px solid var(--ink);padding:12px 8px;text-align:center;}
.comp-item-val{font-family:var(--display);font-size:30px;line-height:1.1;margin-bottom:4px;}
.comp-item-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}
.comp-item-sub{font-size:10px;font-weight:500;color:var(--text-2);margin-top:4px;}
.body-type-label{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px;}
.body-type-val{font-family:var(--display);font-size:42px;line-height:1;text-transform:uppercase;margin-bottom:10px;}
.body-type-desc{font-size:14px;line-height:1.6;font-weight:500;}
.rec-item{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:14px;font-weight:500;}
.rec-icon{width:38px;height:38px;background:var(--paper);border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.rec-text{line-height:1.45;}
.goal-progress{margin-bottom:14px;}
.goal-label{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;}
.goal-bar{height:16px;border:3px solid var(--ink);background:#fff;overflow:hidden;}
.goal-fill{height:100%;background:var(--dotp);transition:width .3s;}
.goal-fill.negative{background:var(--ink);}

/* ---------- Mes ---------- */
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;}
.cal-grid>div{min-width:0;}
.cal-week{margin-bottom:10px;}
.cal-week div{text-align:center;font-weight:700;font-size:14px;}
.cal-day{aspect-ratio:1/.92;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;cursor:pointer;border:3px solid transparent;}
.cal-day.blank{cursor:default;}
.cal-day.s3{background:var(--ink);color:var(--paper);}
.cal-day.s2{background:var(--purple);color:var(--paper);border-color:var(--ink);}
.cal-day.s1{background:#fff;color:var(--ink);border-color:var(--ink);}
.cal-day.s0{background:#fff;color:#aaa49a;border-color:#c9c3b4;}
.cal-day.future{background:transparent;color:var(--ink);border:3px dashed #bdb7a8;cursor:pointer;}
.cal-day.today{text-decoration:underline;text-underline-offset:3px;}
.cal-day.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink);}
.cal-legend{display:flex;align-items:center;gap:14px;margin-top:18px;font-weight:700;font-size:14px;flex-wrap:wrap;}
.cal-legend .sw{display:inline-block;width:20px;height:20px;border:3px solid var(--ink);vertical-align:-4px;margin-right:6px;}
.cal-legend .push{margin-left:auto;font-weight:500;}
.cmp-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:14px;}
.cmp-head .card-title{margin-bottom:0;}
.cmp-range{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-align:right;}
.cmp-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0 18px;}
.cmp-tile{background:#fff;border:3px solid var(--ink);padding:10px 12px;}
.cmp-tile .k{font-size:11px;letter-spacing:.04em;font-weight:500;}
.cmp-tile .v{font-family:var(--display);font-size:34px;line-height:1.15;margin-top:2px;}
.cmp-tile .v.pos{color:var(--purple);}
.table-scroll{overflow-x:auto;margin-top:6px;}
.comparison-table{width:100%;border-collapse:collapse;font-size:12px;font-weight:500;background:#fff;}
.comparison-table th{background:var(--ink);color:var(--paper);padding:9px 8px;text-align:left;font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:10px;}
.comparison-table td{padding:9px 8px;border:2px solid var(--ink);}
.comparison-table td[colspan]{background:var(--ink) !important;color:var(--paper);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:10px;}
.date-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 14px;}
.date-pair>div{min-width:0;}
.date-pair .config-date-input{min-width:0;max-width:100%;font-size:13px;padding:10px 6px;}
.date-pair .k{margin-bottom:4px;font-size:10px;}
.config-date-input{width:100%;background:#fff;border:3px solid var(--ink);color:var(--ink);padding:10px;font-size:14px;font-weight:700;margin-bottom:10px;border-radius:0;min-height:46px;}
.config-section{border-top:3px solid var(--ink);padding-top:16px;margin-top:6px;}
.config-section:first-of-type{border-top:0;padding-top:0;margin-top:0;}
.config-title{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;}
.input-row{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.num-input{flex:1;background:#fff;border:3px solid var(--ink);border-radius:0;color:var(--ink);font-family:var(--display);font-size:24px;padding:8px 12px;outline:none;text-align:center;min-width:0;}
.unit{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;}
.chk{display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;font-size:14px;font-weight:700;}
.chk input{width:20px;height:20px;accent-color:#7a2bd8;cursor:pointer;}
.day-detail-fecha{font-family:var(--display);font-size:26px;text-transform:uppercase;line-height:1.05;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.day-detail-stat{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:2px solid var(--ink);font-size:14px;}
.day-detail-stat:last-child{border-bottom:0;}
.day-detail-label{font-weight:500;color:var(--text-2);}
.day-detail-val{font-weight:700;color:var(--ink);}
.historial-item{background:var(--paper);padding:10px 12px;border:3px solid var(--ink);margin-bottom:8px;font-size:12px;}
.historial-fecha{font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em;}
.historial-data{color:var(--text-2);line-height:1.6;font-weight:500;}
.historial-data strong{color:var(--ink);}

/* ---------- Navegación inferior ---------- */

<script>
const URL_BASE='https://zfilewmutwyoomitgnsp.supabase.co/rest/v1';
const KEY='sb_publishable_fJ94dsmRK_qloX4KzkqCXw_J1oIXFka';
const HEADERS={'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};
const META_SLEEP=8,META_WATER=2500,ALTURA_CM=171,EDAD=29;
const GRASA_META=15,RATIO_META=1.6;
let waterVal=0,trainDone=false,dobleteDone=false,todayRecord=null,todayMed=null,todayMedLoaded=false,rachaDias=0,proximoTab=null;
const today=new Date().toLocaleDateString('en-CA',{timeZone:'America/Bogota'});
const DIAS3=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
const MESES3=['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const MFIELDS=[
  ['m-cuello','cuello_cm'],['m-hombro','hombro_cm'],['m-pecho','pecho_cm'],['m-abdomen','abdomen_cm'],
  ['m-brazo-izq','brazo_izq_cm'],['m-brazo-der','brazo_der_cm'],['m-antebrazo-izq','antebrazo_izq_cm'],['m-antebrazo-der','antebrazo_der_cm'],
  ['m-muslo-izq','muslo_izq_cm'],['m-muslo-der','muslo_der_cm'],['m-pantorrilla-izq','pantorrilla_izq_cm'],['m-pantorrilla-der','pantorrilla_der_cm'],
  ['m-cadera','cadera_cm']
];
const CAMPO_NOMBRE={
  cuello_cm:'Cuello',hombro_cm:'Hombro',pecho_cm:'Pecho',abdomen_cm:'Cintura',
  brazo_izq_cm:'Brazo izquierdo',brazo_der_cm:'Brazo derecho',antebrazo_izq_cm:'Antebrazo izquierdo',antebrazo_der_cm:'Antebrazo derecho',
  muslo_izq_cm:'Muslo izquierdo',muslo_der_cm:'Muslo derecho',pantorrilla_izq_cm:'Pantorrilla izquierda',pantorrilla_der_cm:'Pantorrilla derecha',
  cadera_cm:'Cadera'
};

// Parsea un string "YYYY-MM-DD" como fecha LOCAL (evita el corrimiento de -1 día
// que ocurre con new Date("YYYY-MM-DD") al interpretarse como UTC medianoche)
function parseLocalDate(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  return new Date(y,m-1,d);
}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(s,n){const d=parseLocalDate(s);d.setDate(d.getDate()+n);return ymd(d);}
function diaDelAnio(s){const d=parseLocalDate(s);return Math.round((d-new Date(d.getFullYear(),0,0))/864e5);}
function semanaISO(s){
  const d=parseLocalDate(s);
  const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const n=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-n);
  const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return Math.ceil(((t-y)/864e5+1)/7);
}
const fmt1=n=>(Math.round(n*10)/10).toFixed(1);
const signed=(n,dec=1)=>(n>0.00001?'+':n<-0.00001?'−':'')+Math.abs(n).toFixed(dec);

// ---------- Datos compartidos ----------
async function fetchMedidas(limit=120){
  const r=await fetch(`${URL_BASE}/medidas_antropometricas?order=fecha.desc&limit=${limit}&select=*`,{headers:HEADERS});
  const d=await r.json();
  return Array.isArray(d)?d:[];
}
// Valor más reciente de cada campo (la lista viene ordenada de nuevo a viejo)
function ultimoPorCampo(list){
  const o={};
  list.forEach(r=>Object.keys(r).forEach(k=>{if(o[k]==null&&r[k]!=null)o[k]=r[k];}));
  return o;
}
function pesoDe(m){
  if(!m)return null;
  if(m.peso_kg!=null)return m.peso_kg;
  const s=(m.peso_grasa_kg||0)+(m.peso_magro_kg||0);
  return s?s:null;
}
// Hábitos por fecha en un rango (fusiona filas duplicadas tomando el mejor valor)
async function fetchHabitsRange(a,b){
  const r=await fetch(`${URL_BASE}/habits?fecha=gte.${a}&fecha=lte.${b}&select=*`,{headers:HEADERS});
  const d=await r.json();
  const o={};
  (Array.isArray(d)?d:[]).forEach(x=>{
    const c=o[x.fecha]||{};
    o[x.fecha]={
      fecha:x.fecha,
      sueño_horas:Math.max(c.sueño_horas||0,x.sueño_horas||0),
      entrenamiento:c.entrenamiento||x.entrenamiento||false,
      agua_ml:Math.max(c.agua_ml||0,x.agua_ml||0),
      doblete:c.doblete||x.doblete||false
    };
  });
  return o;
}

const TABS=['habits','medidor','stats','analisis','historial'];
function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',TABS[i]===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+name).classList.add('active');
  window.scrollTo({top:0});
  if(name==='medidor') loadMedidorPanel();
  if(name==='analisis') loadAnalisisPanel();
  if(name==='historial') loadHistorialPanel();
  if(name==='stats') loadStatsPanel();
}

function renderHeaders(){
  const d=parseLocalDate(today);
  const cap='CAPÍTULO '+diaDelAnio(today);
  document.getElementById('eyebrow-habits').textContent=`${cap} · ${DIAS3[d.getDay()]} ${d.getDate()} ${MESES3[d.getMonth()]}`;
  document.getElementById('eyebrow-medidor').textContent=cap;
  document.getElementById('eyebrow-stats').textContent='SEMANA '+semanaISO(today);
}

async function init(){
  renderHeaders();
  renderTrain();
  updateWaterDisplay();
  try{
    const res=await fetch(`${URL_BASE}/habits?fecha=eq.${today}&select=*`,{headers:HEADERS});
    const data=await res.json();
    if(Array.isArray(data)&&data.length){
      // Defensivo: si hay duplicados para hoy, fusionar tomando el mejor valor de cada campo
      const merged=data.reduce((acc,r)=>({
        id:r.id,
        sueño_horas:Math.max(acc.sueño_horas||0,r.sueño_horas||0),
        entrenamiento:acc.entrenamiento||r.entrenamiento||false,
        agua_ml:Math.max(acc.agua_ml||0,r.agua_ml||0),
        doblete:acc.doblete||r.doblete||false
      }),{});
      todayRecord=merged;
      prefillForm(merged);
    }
  }catch(e){console.error(e);}
  loadRacha();
  loadMedidorPanel();
}

function prefillForm(r){
  if(r.sueño_horas){document.getElementById('sleep-val').value=r.sueño_horas;updateSleepBar(r.sueño_horas);}
  if(r.entrenamiento)trainDone=true;
  if(r.doblete){dobleteDone=true;trainDone=true;}
  if(r.agua_ml)waterVal=r.agua_ml;
  renderTrain();
  updateWaterDisplay();
}

// ---------- Racha, contador y "Próximo" ----------
async function loadRacha(){
  try{
    const r=await fetch(`${URL_BASE}/habits?fecha=gte.${addDays(today,-90)}&select=*`,{headers:HEADERS});
    const data=await r.json();
    if(!Array.isArray(data))return;
    const act=new Set();
    data.forEach(d=>{if((d.sueño_horas||0)>0||d.entrenamiento||(d.agua_ml||0)>0)act.add(d.fecha);});
    let cur=act.has(today)?today:addDays(today,-1),n=0;
    while(act.has(cur)){n++;cur=addDays(cur,-1);}
    rachaDias=n;
    updateHoyMeta();
  }catch(e){console.error(e);}
}
function sleepHoy(){return parseFloat(document.getElementById('sleep-val').value)||0;}
function habitCount(){return (sleepHoy()>0?1:0)+(trainDone?1:0)+(waterVal>=META_WATER?1:0);}
function updateHoyMeta(){
  document.getElementById('pill-habits').textContent=`${habitCount()} / 3 HÁBITOS`;
  document.getElementById('pill-racha').textContent=`RACHA ${rachaDias} ${rachaDias===1?'DÍA':'DÍAS'}`;
  let txt='Todo listo por hoy ✓';proximoTab=null;
  if(!todayMedLoaded){txt='…';}
  else if(!todayMed||todayMed.peso_kg==null){txt='Próximo: registrar peso';proximoTab='medidor';}
  else if(!(sleepHoy()>0)){txt='Próximo: registrar sueño';}
  else if(!trainDone){txt='Próximo: entrenar';}
  else if(waterVal<META_WATER){txt='Próximo: completar el agua';}
  document.getElementById('next-text').textContent=txt;
}
function irProximo(){
  if(proximoTab)switchTab(proximoTab);
  else if(!(sleepHoy()>0))document.getElementById('sleep-val').focus();
}

// ---------- Sueño, agua, entreno (se guardan solos) ----------
const saveTimers={};
function scheduleSave(type){clearTimeout(saveTimers[type]);saveTimers[type]=setTimeout(()=>save(type),700);}

document.getElementById('sleep-val').addEventListener('input',function(){updateSleepBar(parseFloat(this.value)||0);updateHoyMeta();});
document.getElementById('sleep-val').addEventListener('change',function(){save('sleep');});
function updateSleepBar(v){
  const pct=Math.min(100,Math.round(v/META_SLEEP*100));
  document.getElementById('sleep-bar').style.width=pct+'%';
}

function addWater(ml){waterVal=Math.min(5000,waterVal+ml);updateWaterDisplay();scheduleSave('water');}
function resetWater(){waterVal=0;updateWaterDisplay();scheduleSave('water');}
function updateWaterDisplay(){
  document.getElementById('water-display').textContent=parseFloat((waterVal/1000).toFixed(2));
  document.getElementById('water-bar').style.width=Math.min(100,Math.round(waterVal/META_WATER*100))+'%';
  updateHoyMeta();
}

function renderTrain(){
  document.getElementById('train-tile').classList.toggle('on',trainDone);
  document.getElementById('train-label').textContent=dobleteDone?'¡DOBLETE!':trainDone?'¡HECHO!':'SIN ENTRENO';
  document.getElementById('doblete-toggle').classList.toggle('on',dobleteDone);
  document.getElementById('doblete-icon').textContent=dobleteDone?'✓':'+';
  document.getElementById('doblete-label').textContent=dobleteDone?'DOBLETE ×2':'DOBLETE';
  updateHoyMeta();
}
function toggleTrain(){
  trainDone=!trainDone;
  if(!trainDone)dobleteDone=false;
  renderTrain();
  save('train');
}
function toggleDoblete(){
  dobleteDone=!dobleteDone;
  if(dobleteDone)trainDone=true;
  renderTrain();
  save('train');
}

async function save(type){
  let payload={fecha:today};
  if(type==='sleep') payload.sueño_horas=parseFloat(document.getElementById('sleep-val').value)||0;
  if(type==='train'){
    payload.entrenamiento=trainDone;
    payload.doblete=dobleteDone;
  }
  if(type==='water') payload.agua_ml=waterVal;
  try{
    const res=await fetch(`${URL_BASE}/habits?on_conflict=fecha`,{
      method:'POST',
      headers:{...HEADERS,'Prefer':'resolution=merge-duplicates,return=representation'},
      body:JSON.stringify(payload)
    });
    if(!res.ok)throw new Error(await res.text());
    const data=await res.json();
    if(data[0])todayRecord=data[0];
    showToast(type==='sleep'?'🌙 Sueño guardado':type==='train'?'⚡ Entreno guardado':'💧 Agua guardada');
    loadRacha();
  }catch(e){showToast('Error al guardar');console.error(e);}
}


// ---------- Medidor ----------
let medList=[],medPrev={};

async function loadMedidorPanel(){
  try{
    medList=await fetchMedidas(120);
    todayMed=medList.find(r=>r.fecha===today)||null;
    todayMedLoaded=true;
    const prevList=medList.filter(r=>r.fecha<today);
    medPrev={};
    MFIELDS.forEach(([id,f])=>{const r=prevList.find(x=>x[f]!=null);medPrev[f]=r?r[f]:null;});
    MFIELDS.forEach(([id,f])=>{document.getElementById(id).value=(todayMed&&todayMed[f]!=null)?Number(todayMed[f]).toFixed(1):'';});
    document.getElementById('peso-medidor').value=(todayMed&&todayMed.peso_kg!=null)?Number(todayMed.peso_kg).toFixed(1):'';
    refreshMedidorUI();
  }catch(e){console.error(e);}
  updateHoyMeta();
}

function refreshMedidorUI(){
  let n=0;
  MFIELDS.forEach(([id,f])=>{
    const inp=document.getElementById(id);
    const v=parseFloat(inp.value);
    const box=inp.closest('.mcard,.mini');
    const dl=box.querySelector('.mdelta');
    const has=!isNaN(v);
    const p=medPrev[f];
    box.classList.toggle('empty',!has);
    if(has){
      n++;
      if(p!=null){
        const d=v-p;
        dl.textContent=Math.abs(d)<0.05?'=':signed(d);
        dl.className='mdelta'+(d>=0.05?' up':'');
      }else{dl.textContent='';dl.className='mdelta';}
    }else{
      dl.textContent=p!=null?'últ. '+p:'';
      dl.className='mdelta';
    }
  });
  document.getElementById('med-count').textContent=`${n} DE ${MFIELDS.length} REGISTRADAS`;

  const pv=parseFloat(document.getElementById('peso-medidor').value);
  const el=document.getElementById('peso-delta');
  const prev=medList.find(r=>r.fecha<today&&r.peso_kg!=null);
  if(!isNaN(pv)){
    const ref=medList.find(r=>r.fecha<=addDays(today,-7)&&r.peso_kg!=null);
    if(ref)el.textContent=`${signed(pv-ref.peso_kg)} ESTA SEMANA`;
    else if(prev)el.textContent=`${signed(pv-prev.peso_kg)} VS ÚLTIMO`;
    else el.textContent='PRIMER REGISTRO';
  }else{
    el.textContent=prev?`ÚLTIMO ${prev.peso_kg} KG`:'REGISTRA TU PESO';
  }
}
document.querySelectorAll('.mcard input,.mini input,#peso-medidor').forEach(i=>i.addEventListener('input',refreshMedidorUI));

function calcularGrasaUSNavy(cuello,abdomen,altura){
  const grasaPct=(86.010*Math.log10(abdomen-cuello))-(70.041*Math.log10(altura))+36.76;
  return Math.max(5,Math.min(60,grasaPct));
}

function getMedidorValue(id){
  const v=parseFloat(document.getElementById(id).value);
  return isNaN(v)?null:v;
}

async function saveMedidor(){
  const peso=getMedidorValue('peso-medidor');
  const cuello=getMedidorValue('m-cuello');
  const hombro=getMedidorValue('m-hombro');
  const pecho=getMedidorValue('m-pecho');
  const abdomen=getMedidorValue('m-abdomen');
  const brazoIzq=getMedidorValue('m-brazo-izq');
  const brazoDer=getMedidorValue('m-brazo-der');
  const antebrazoIzq=getMedidorValue('m-antebrazo-izq');
  const antebrazoDer=getMedidorValue('m-antebrazo-der');
  const musloIzq=getMedidorValue('m-muslo-izq');
  const musloDer=getMedidorValue('m-muslo-der');
  const pantorrillaIzq=getMedidorValue('m-pantorrilla-izq');
  const pantorrillaDer=getMedidorValue('m-pantorrilla-der');
  const cadera=getMedidorValue('m-cadera');

  const payload={
    fecha:today,
    peso_kg:peso,
    cuello_cm:cuello,
    hombro_cm:hombro,
    pecho_cm:pecho,
    abdomen_cm:abdomen,
    brazo_izq_cm:brazoIzq,
    brazo_der_cm:brazoDer,
    antebrazo_izq_cm:antebrazoIzq,
    antebrazo_der_cm:antebrazoDer,
    muslo_izq_cm:musloIzq,
    muslo_der_cm:musloDer,
    pantorrilla_izq_cm:pantorrillaIzq,
    pantorrilla_der_cm:pantorrillaDer,
    cadera_cm:cadera
  };

  // Si hay cuello+abdomen+peso, calculamos grasa corporal con US Navy
  if(cuello&&abdomen&&peso){
    const grasaPct=calcularGrasaUSNavy(cuello,abdomen,ALTURA_CM);
    payload.grasa_pct=grasaPct;
    payload.peso_grasa_kg=(peso*grasaPct)/100;
    payload.peso_magro_kg=peso-payload.peso_grasa_kg;
  }

  try{
    await fetch(`${URL_BASE}/medidas_antropometricas?on_conflict=fecha`,{
      method:'POST',
      headers:{...HEADERS,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(payload)
    });
    showToast('📏 Medidas guardadas');
    loadMedidorPanel();
    loadHistorialMedidas();
  }catch(e){showToast('Error al guardar medidas');console.error(e);}
}

async function loadHistorialMedidas(){
  try{
    const res=await fetch(`${URL_BASE}/medidas_antropometricas?order=fecha.desc&limit=10`,{headers:HEADERS});
    const data=await res.json();
    
    let html='<div style="font-size:11px;color:var(--text-2);margin-bottom:8px;">📊 Últimas medidas:</div>';
    data.forEach(m=>{
      const fechaFmt=parseLocalDate(m.fecha).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric',timeZone:'America/Bogota'});
      const partes=[];
      if(m.peso_kg!=null)partes.push(`Peso: <strong>${m.peso_kg}</strong>kg`);
      if(m.grasa_pct!=null)partes.push(`Grasa: <strong>${m.grasa_pct.toFixed(1)}%</strong>`);
      if(m.abdomen_cm!=null)partes.push(`Abd: <strong>${m.abdomen_cm}</strong>cm`);
      if(m.cuello_cm!=null)partes.push(`Cuello: <strong>${m.cuello_cm}</strong>cm`);
      if(m.cadera_cm!=null)partes.push(`Cadera: <strong>${m.cadera_cm}</strong>cm`);
      html+=`<div class="historial-item">
        <div class="historial-fecha">${fechaFmt}</div>
        <div class="historial-data">${partes.join(' · ')||'Sin datos'}</div>
      </div>`;
    });
    document.getElementById('historial-medidas').innerHTML=html;
  }catch(e){console.error(e);}
}

function toggleHistorialMedidas(){
  const hist=document.getElementById('historial-medidas');
  if(hist.style.display==='none'){
    loadHistorialMedidas();
    hist.style.display='block';
  }else{
    hist.style.display='none';
  }
}

let currentMonth=(()=>{const d=parseLocalDate(today);return new Date(d.getFullYear(),d.getMonth(),1);})();

async function loadStatsPanel(){
  const el=document.getElementById('stats-content');
  try{
    const mon=addDays(today,-((parseLocalDate(today).getDay()+6)%7));
    const [list,wk]=await Promise.all([fetchMedidas(120),fetchHabitsRange(mon,addDays(mon,6))]);
    const ult=ultimoPorCampo(list);

    if(ult.peso_kg==null){
      el.innerHTML=`<div class="card"><div class="empty-note">Registra tu peso en MEDIR</div></div>`;
      return;
    }

    // IMC y rango saludable (IMC 18.5 – 24.9)
    const peso=ult.peso_kg,h=ALTURA_CM/100,imc=peso/(h*h);
    const clase=imc<18.5?'Bajo peso':imc<25?'Normal':imc<30?'Sobrepeso':'Obesidad';
    const pMin=18.5*h*h,pMax=24.9*h*h;
    const idealSub=peso<pMin?`kg · te faltan ${fmt1(pMin-peso)}`:peso>pMax?`kg · sobran ${fmt1(peso-pMax)}`:'kg · estás dentro';

    // Composición corporal (último registro con grasa calculada)
    const rg=list.find(r=>r.grasa_pct!=null);
    let comp='';
    if(rg){
      const pg=rg.peso_grasa_kg||0,pm=rg.peso_magro_kg||0,tot=(pg+pm)||1;
      const tail=Math.max(6,Math.min(60,Math.round(pg/tot*100)));
      const metaKg=pm*GRASA_META/(100-GRASA_META);
      const aMeta=pg-metaKg;
      comp=`
        <section class="card">
          <h2 class="card-title">Composición corporal</h2>
          <div class="comp-bar">
            <div class="comp-lean" style="width:${100-tail}%"><span>MAGRO ${fmt1(pm)} KG</span></div>
            <div class="comp-fat" style="width:${tail}%"></div>
          </div>
          <div class="trio">
            <div><div class="k">Grasa</div><div class="v">${fmt1(rg.grasa_pct)}%</div></div>
            <div><div class="k">Peso grasa</div><div class="v">${fmt1(pg)} kg</div></div>
            <div><div class="k">A meta</div><div class="v acc">${aMeta>0.05?'−'+fmt1(aMeta)+' kg':'✓ META'}</div></div>
          </div>
          <div class="foot">Meta de grasa: ${GRASA_META}% · fórmula US Navy (cuello + abdomen)</div>
        </section>`;
    }

    // Sueño de la semana (lunes a domingo)
    const lbl=['L','M','M','J','V','S','D'];
    const bars=lbl.map((l,i)=>{
      const hrs=(wk[addDays(mon,i)]||{}).sueño_horas||0;
      const pct=Math.min(100,hrs/10*100);
      return `<div class="bar ${hrs>=META_SLEEP?'goal':''} ${hrs?'':'none'}" style="height:${hrs?Math.max(pct,6):0}%"></div>`;
    }).join('');
    const sleepCard=`
      <section class="card cream">
        <div class="card-title"><span>Sueño · 7 días</span><span class="k" style="font-family:var(--body);font-size:12px;">— Meta 8h</span></div>
        <div class="chart-wrap">
          <div class="chart"><div class="goal-line"></div>${bars}</div>
          <div class="bar-lbls">${lbl.map(l=>`<div>${l}</div>`).join('')}</div>
        </div>
      </section>`;

    // Medidas actuales (último valor conocido de cada zona)
    const campos=[
      ['cuello_cm','Cuello'],['hombro_cm','Hombro'],['pecho_cm','Pecho'],['abdomen_cm','Cintura'],
      ['brazo_izq_cm','Brazo izq.'],['brazo_der_cm','Brazo der.'],['antebrazo_izq_cm','Antebr. izq.'],['antebrazo_der_cm','Antebr. der.'],
      ['muslo_izq_cm','Muslo izq.'],['muslo_der_cm','Muslo der.'],['pantorrilla_izq_cm','Pantorr. izq.'],['pantorrilla_der_cm','Pantorr. der.'],
      ['cadera_cm','Cadera']
    ].filter(([k])=>ult[k]!=null);
    const medCard=campos.length?`
      <section class="card">
        <h2 class="card-title">Medidas actuales</h2>
        <div class="mt-grid">${campos.map(([k,l])=>`<div class="mt"><div class="k">${l}</div><div class="v">${ult[k]}</div></div>`).join('')}</div>
        <div class="foot">Valores en cm · último registro de cada zona</div>
      </section>`:'';

    el.innerHTML=`
      <div class="stat-tiles">
        <div class="stile black"><div class="k">IMC</div><div class="big">${fmt1(imc)}</div><div class="sub">${clase} · ${h.toFixed(2)} m</div></div>
        <div class="stile white"><div class="k">Peso ideal</div><div class="big">${Math.round(pMin)}–${Math.round(pMax)}</div><div class="sub">${idealSub}</div></div>
      </div>
      ${comp}${sleepCard}${medCard}`;
  }catch(e){
    console.error(e);
    el.innerHTML=`<div class="card"><div class="empty-note">Error al cargar stats</div></div>`;
  }
}

function setHeadline(html){document.getElementById('analisis-headline').innerHTML=html;}

async function loadAnalisisPanel(){
  const box=document.getElementById('analisis-content');
  try{
    const list=await fetchMedidas(150);
    if(!list.length){
      setHeadline('Análisis');
      box.innerHTML=`<div class="card"><div class="empty-note">Ingresa tus medidas en MEDIR y aquí aparecerá tu análisis</div></div>`;
      return;
    }
    const ult=ultimoPorCampo(list);
    const fechas={};
    MFIELDS.forEach(([id,f])=>{const r=list.find(x=>x[f]!=null);fechas[f]=r?r.fecha:null;});

    // 1) Proporción hombro / cintura
    let ratioHtml='';
    if(ult.hombro_cm&&ult.abdomen_cm){
      const ratio=ult.hombro_cm/ult.abdomen_cm;
      const falta=RATIO_META-ratio;
      ratioHtml=`
        <div class="ratio-card">
          <div><div class="k">Proporción hombro / cintura</div><div class="num">${ratio.toFixed(2)}</div></div>
          <div class="ratio-side">Meta ${RATIO_META.toFixed(2)}<br>${falta>0.004?`<span class="acc">faltan ${falta.toFixed(2)}</span>`:`<span class="acc">¡meta lograda!</span>`}</div>
        </div>`;
    }

    // 2) Simetría: el par izquierdo/derecho con más diferencia
    const pares=[['Brazo','brazo_izq_cm','brazo_der_cm',true],['Antebrazo','antebrazo_izq_cm','antebrazo_der_cm',true],['Muslo','muslo_izq_cm','muslo_der_cm',true],['Pantorrilla','pantorrilla_izq_cm','pantorrilla_der_cm',false]];
    let best=null;
    pares.forEach(([n,i,d,m])=>{
      if(ult[i]!=null&&ult[d]!=null){
        const diff=ult[d]-ult[i];
        if(!best||Math.abs(diff)>Math.abs(best.diff))best={n,diff,m};
      }
    });
    let simHtml='';
    if(best){
      const a=Math.abs(best.diff);
      let txt;
      if(a<0.05)txt=`${best.n}s parejos: izquierdo y derecho iguales.`;
      else{
        const lado=best.diff>0?(best.m?'derecho':'derecha'):(best.m?'izquierdo':'izquierda');
        const otro=best.diff>0?(best.m?'izquierdo':'izquierda'):(best.m?'derecho':'derecha');
        txt=`${best.n} ${lado} +${a.toFixed(1)} cm sobre el ${otro}.`.replace(/sobre el (izquierda|derecha)/,'sobre la $1');
      }
      txt+=a<1?' Diferencia normal: menos de 1 cm.':' Diferencia notable: prioriza el lado más débil.';
      simHtml=`<div class="bubble"><h3>Simetría</h3><p>${txt}</p></div>`;
    }

    // 3) Tendencia de cintura (~4 semanas) y titular
    let cinHtml='',headline='¡SIGUE<br>ASÍ!';
    const cA=list.find(r=>r.abdomen_cm!=null);
    if(cA){
      let ref=list.find(r=>r.fecha<=addDays(cA.fecha,-28)&&r.abdomen_cm!=null);
      if(!ref)ref=[...list].reverse().find(r=>r.abdomen_cm!=null&&r.fecha<cA.fecha);
      if(ref&&ref.fecha!==cA.fecha){
        const dias=(parseLocalDate(cA.fecha)-parseLocalDate(ref.fecha))/864e5;
        const sem=Math.max(1,Math.round(dias/7));
        const d=cA.abdomen_cm-ref.abdomen_cm;
        const pRef=list.find(r=>r.fecha<=ref.fecha&&r.pecho_cm!=null);
        let pecho='';
        if(ult.pecho_cm!=null&&pRef){
          const dp=ult.pecho_cm-pRef.pecho_cm;
          pecho=Math.abs(dp)<=1?' mientras el pecho se mantiene':` y el pecho ${signed(dp)} cm`;
        }
        let veredicto,
          cintxt=`${signed(d)} cm en ${sem} ${sem===1?'semana':'semanas'}${pecho}.`;
        if(d<-0.2){veredicto=' Vas en la dirección correcta.';headline='¡BUEN<br>AVANCE!';}
        else if(d>0.5){veredicto=' Sube un poco: revisa dieta y descanso.';headline='¡A<br>AJUSTAR!';}
        else{veredicto=' Se mantiene estable.';headline='¡VAS<br>ESTABLE!';}
        cinHtml=`<div class="bubble alt"><h3>Cintura</h3><p>${cintxt}${veredicto}</p></div>`;
      }else{
        cinHtml=`<div class="bubble alt"><h3>Cintura</h3><p>Mide de nuevo en un par de semanas para ver tu tendencia.</p></div>`;
      }
    }
    setHeadline(headline);

    // 4) Siguiente misión
    const faltan=MFIELDS.filter(([id,f])=>ult[f]==null);
    let mision;
    if(faltan.length){
      mision=`Mide ${CAMPO_NOMBRE[faltan[0][1]].toLowerCase()} para completar las ${MFIELDS.length} zonas.`;
    }else{
      let old=null;
      MFIELDS.forEach(([id,f])=>{const dt=fechas[f];if(dt&&(!old||dt<old.dt))old={f,dt};});
      const dias=old?Math.round((parseLocalDate(today)-parseLocalDate(old.dt))/864e5):0;
      mision=dias>=7?`Hace ${dias} días no mides ${CAMPO_NOMBRE[old.f].toLowerCase()}. Actualízala.`:'Todas tus zonas están al día. ¡Sigue así!';
    }
    const misionHtml=`<div class="mission"><div class="bang">!</div><div><div class="k">Siguiente misión</div><p>${mision}</p></div></div>`;

    // ---------- Detalle (composición, gasto, metas, recomendaciones) ----------
    let detalle='';
    const m=list.find(r=>r.grasa_pct!=null);
    if(m){
      const pesoGrasa=m.peso_grasa_kg||0,pesoMagro=m.peso_magro_kg||0,grasaPct=m.grasa_pct;
      const peso=pesoGrasa+pesoMagro;
      const pesoAgua=pesoMagro*0.72,pesoProteina=pesoMagro*0.20;

      else if(grasaPct<35){tipoNombre='Sobrepeso';tipoDesc='Exceso de grasa corporal. Se recomienda programa de actividad física.';}

      let recHtml='';

        recHtml+=`<div class="rec-item"><div class="rec-icon">💪</div><div class="rec-text">Agrega entrenamiento de fuerza 2-3 veces por semana</div></div>`;
        recHtml+=`<div class="rec-item"><div class="rec-icon">🥗</div><div class="rec-text">Controla ingesta de calorías, aumenta proteína a 1.6g/kg</div></div>`;

        recHtml+=`<div class="rec-item"><div class="rec-icon">💪</div><div class="rec-text">Fortalecimiento muscular 2-3 veces por semana</div></div>`;
        recHtml+=`<div class="rec-item"><div class="rec-icon">🥗</div><div class="rec-text">Dieta balanceada: 1.2-1.5g proteína por kg de peso</div></div>`;
      }else{
        recHtml+=`<div class="rec-item"><div class="rec-icon">💪</div><div class="rec-text">Mantén rutina de fuerza para preservar masa muscular</div></div>`;
        recHtml+=`<div class="rec-item"><div class="rec-icon">🏃</div><div class="rec-text">Continúa con actividad aeróbica moderada</div></div>`;
        recHtml+=`<div class="rec-item"><div class="rec-icon">✨</div><div class="rec-text">Excelente condición física, mantén disciplina</div></div>`;
      }

      const camposMedidas=[

      detalle=`

          <h2 class="card-title">Medidas antropométricas</h2>

            <div class="comp-item"><div class="comp-item-val">${peso.toFixed(1)}</div><div class="comp-item-label">Peso total</div><div class="comp-item-sub">kg</div></div>
            <div class="comp-item"><div class="comp-item-val">${pesoAgua.toFixed(1)}</div><div class="comp-item-label">Agua</div><div class="comp-item-sub">72%</div></div>
            <div class="comp-item"><div class="comp-item-val">${pesoGrasa.toFixed(1)}</div><div class="comp-item-label">Grasa</div><div class="comp-item-sub">${grasaPct.toFixed(1)}%</div></div>
            <div class="comp-item"><div class="comp-item-val">${pesoProteina.toFixed(1)}</div><div class="comp-item-label">Proteína</div><div class="comp-item-sub">20%</div></div>
          </div>
        </div>

        <div class="card cream">
          <div class="body-type-label">Clasificación</div>

        <div class="card">
          <h2 class="card-title">Gasto calórico estimado</h2>

          <div class="comp-visual" style="grid-template-columns:1fr 1fr 1fr;">
            <div class="comp-item"><div class="comp-item-val" style="font-size:24px;">${tmb.toFixed(0)}</div><div class="comp-item-label">TMB</div><div class="comp-item-sub">kcal/día</div></div>
            <div class="comp-item"><div class="comp-item-val" style="font-size:24px;">${calMantenimiento.toFixed(0)}</div><div class="comp-item-label">Mantener</div><div class="comp-item-sub">kcal/día</div></div>
            <div class="comp-item"><div class="comp-item-val acc" style="font-size:24px;">${diffGrasa>0?calDeficit.toFixed(0):calSuperavit.toFixed(0)}</div><div class="comp-item-label">${diffGrasa>0?'Déficit':'Superávit'}</div><div class="comp-item-sub">kcal/día</div></div>

        <div class="card">

          ${semanasParaMeta>0?`<div class="foot" style="margin-top:16px;">⏱️ A un déficit de 500 kcal/día, llegarías a tu meta en aprox. <strong>${semanasParaMeta} semanas</strong></div>`:''}
        </div>

        <div class="card">

    }else{
      detalle=`<div class="card"><div class="empty-note">Ingresa peso, cuello y abdomen en MEDIR para ver el análisis de composición corporal</div></div>`;
    }

    box.innerHTML=ratioHtml+simHtml+cinHtml+misionHtml+detalle;
  }catch(e){
    console.error(e);
    box.innerHTML=`<div class="card"><div class="empty-note">Error al cargar análisis</div></div>`;
  }
}

async function loadHistorialPanel(){
  await loadCalendar();
  const d1=document.getElementById('compare-date1'),d2=document.getElementById('compare-date2');
  if(!d1.value&&!d2.value){
    d1.value=today.slice(0,8)+'01';
    d2.value=today;
    compareNuevoClick();
  }
}

async function loadCalendar(){
  const year=currentMonth.getFullYear(),month=currentMonth.getMonth();
  document.getElementById('mes-title').textContent=MESES[month].toUpperCase();
  document.getElementById('eyebrow-mes').textContent='ARCO '+year;
  const dim=new Date(year,month+1,0).getDate();
  const start=new Date(year,month,1).getDay();
  try{
    const data=await fetchHabitsRange(ymd(new Date(year,month,1)),ymd(new Date(year,month,dim)));
    let html='',perfect=0;
    for(let i=0;i<start;i++)html+=`<div class="cal-day blank"></div>`;
    for(let day=1;day<=dim;day++){
      const ds=ymd(new Date(year,month,day));
      const dd=data[ds];
      const count=dd?((dd.sueño_horas>0?1:0)+(dd.entrenamiento?1:0)+(dd.agua_ml>=META_WATER?1:0)):0;
      if(count===3)perfect++;
      const cls=ds>today?'future':'s'+count;
      html+=`<div class="cal-day ${cls}${ds===today?' today':''}" data-d="${ds}" onclick="selectDay('${ds}')">${day}</div>`;
    }
    document.getElementById('calendar-grid').innerHTML=html;
    document.getElementById('perfect-count').textContent=`${perfect} ${perfect===1?'día perfecto':'días perfectos'}`;
  }catch(e){
    console.error(e);
    showToast('Error al cargar calendario');
  }
}

async function selectDay(dateStr){
  try{
    const resHabits=await fetch(`${URL_BASE}/habits?fecha=eq.${dateStr}&select=*`,{headers:HEADERS});
    const habitsData=await resHabits.json();
    // Defensivo: si hay múltiples filas para la misma fecha (duplicados), fusionar tomando el mejor valor de cada campo
    let dayData={fecha:dateStr};
    if(habitsData.length){
      dayData=habitsData.reduce((acc,r)=>({
        fecha:dateStr,
        sueño_horas:Math.max(acc.sueño_horas||0,r.sueño_horas||0),
        entrenamiento:acc.entrenamiento||r.entrenamiento||false,
        agua_ml:Math.max(acc.agua_ml||0,r.agua_ml||0),
        doblete:acc.doblete||r.doblete||false
      }),{});
    }
    
    // Cargar medidas de ese día
    const resMedidas=await fetch(`${URL_BASE}/medidas_antropometricas?fecha=eq.${dateStr}&select=*`,{headers:HEADERS});
    const medidasData=await resMedidas.json();
    const medidas=medidasData[0];
    
    const fecha=parseLocalDate(dateStr).toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',timeZone:'America/Bogota'});
    
    let html=`
      <div class="day-detail-fecha">
        📅 ${fecha.charAt(0).toUpperCase()+fecha.slice(1)}
        <button class="reset-btn" style="margin-left:auto;padding:4px 8px;font-size:9px;" onclick="editDay('${dateStr}')">Editar</button>
      </div>
      <div class="day-detail-stat">
        <span class="day-detail-label">🌙 Sueño</span>
        <span class="day-detail-val">${dayData.sueño_horas||0}h</span>
      </div>
      <div class="day-detail-stat">
        <span class="day-detail-label">⚡ Entrenamiento</span>
        <span class="day-detail-val">${dayData.entrenamiento?(dayData.doblete?'✓ Doblete (x2)':'✓ Sí'):'○ No'}</span>
      </div>
      <div class="day-detail-stat">
        <span class="day-detail-label">💧 Agua</span>
        <span class="day-detail-val">${dayData.agua_ml||0}ml</span>
      </div>
    `;
    
    if(medidas){
      const pesoTotal=medidas.peso_kg||((medidas.peso_grasa_kg||0)+(medidas.peso_magro_kg||0));
      const camposMedidas=[
        ['cuello_cm','Cuello'],['hombro_cm','Hombro'],['pecho_cm','Pecho'],['abdomen_cm','Cintura/Abdomen'],
        ['brazo_izq_cm','Brazo Izq'],['brazo_der_cm','Brazo Der'],
        ['antebrazo_izq_cm','Antebrazo Izq'],['antebrazo_der_cm','Antebrazo Der'],
        ['muslo_izq_cm','Muslo Izq'],['muslo_der_cm','Muslo Der'],
        ['pantorrilla_izq_cm','Pantorrilla Izq'],['pantorrilla_der_cm','Pantorrilla Der'],
        ['cadera_cm','Cadera']
      ];
      const medidasStatsHtml=camposMedidas.filter(([k])=>medidas[k]!=null).map(([k,label])=>`
          <div class="day-detail-stat">
            <span class="day-detail-label">${label}</span>
            <span class="day-detail-val">${medidas[k]}cm</span>
          </div>
      `).join('');
      html+=`
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
          <div style="font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;font-weight:600;">Medidas antropométricas</div>
          ${medidasStatsHtml||'<div style="font-size:11px;color:var(--text-3);">Sin medidas registradas</div>'}
        </div>
        <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
          <div style="font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;font-weight:600;">Composición corporal</div>
          <div class="day-detail-stat">
            <span class="day-detail-label">Peso total</span>
            <span class="day-detail-val">${pesoTotal?pesoTotal.toFixed(1):'—'}kg</span>
          </div>
          <div class="day-detail-stat">
            <span class="day-detail-label">Grasa corporal</span>
            <span class="day-detail-val" style="color:var(--red);">${medidas.grasa_pct!=null?medidas.grasa_pct.toFixed(1)+'%':'—'}</span>
          </div>
          <div class="day-detail-stat">
            <span class="day-detail-label">Peso de grasa</span>
            <span class="day-detail-val" style="color:var(--red);">${(medidas.peso_grasa_kg||0).toFixed(1)}kg</span>
          </div>
          <div class="day-detail-stat">
            <span class="day-detail-label">Peso magro</span>
            <span class="day-detail-val" style="color:var(--green);">${(medidas.peso_magro_kg||0).toFixed(1)}kg</span>
          </div>
        </div>
      `;
    }
    
    document.getElementById('day-detail-content').innerHTML=html;
    document.getElementById('day-detail-card').style.display='block';
    document.querySelectorAll('.cal-day.sel').forEach(e=>e.classList.remove('sel'));
    const celda=document.querySelector(`.cal-day[data-d="${dateStr}"]`);if(celda)celda.classList.add('sel');
  }catch(e){
    console.error(e);
  }
}

function editDay(dateStr){
  document.getElementById('config-date').value=dateStr;
  const el=document.querySelector('[id="config-date"]');
  el.scrollIntoView({behavior:'smooth',block:'center'});
}

async function updateDayData(){
  const fecha=document.getElementById('config-date').value;
  if(!fecha){showToast('Selecciona una fecha');return;}
  
  const payload={
    fecha:fecha,
    sueño_horas:parseFloat(document.getElementById('config-sleep').value)||0,
    agua_ml:parseInt(document.getElementById('config-water').value)||0,
    entrenamiento:document.getElementById('config-train').checked||document.getElementById('config-doblete').checked,
    doblete:document.getElementById('config-doblete').checked
  };
  
  try{
    await fetch(`${URL_BASE}/habits?on_conflict=fecha`,{
      method:'POST',
      headers:{...HEADERS,'Prefer':'resolution=merge-duplicates'},
      body:JSON.stringify(payload)
    });
    
    showToast('✓ Día actualizado');
    loadCalendar();
    selectDay(fecha);
  }catch(e){
    showToast('Error al guardar');
    console.error(e);
  }
}

async function compareNuevoClick(){
  const date1=document.getElementById('compare-date1').value;
  const date2=document.getElementById('compare-date2').value;
  
  if(!date1||!date2){showToast('Ingresa ambas fechas');return;}
  
  try{
    const [res1,res2,resMed1,resMed2]=await Promise.all([
      fetch(`${URL_BASE}/habits?fecha=eq.${date1}&select=*`,{headers:HEADERS}),
      fetch(`${URL_BASE}/habits?fecha=eq.${date2}&select=*`,{headers:HEADERS}),
      fetch(`${URL_BASE}/medidas_antropometricas?fecha=eq.${date1}&select=*`,{headers:HEADERS}),
      fetch(`${URL_BASE}/medidas_antropometricas?fecha=eq.${date2}&select=*`,{headers:HEADERS})
    ]);
    
    const data1=await res1.json(),data2=await res2.json();
    const med1Data=await resMed1.json(),med2Data=await resMed2.json();
    const d1=data1[0]||{},d2=data2[0]||{};
    const m1=med1Data[0],m2=med2Data[0];
    
    const f1=parseLocalDate(date1).toLocaleDateString('es-CO',{month:'short',day:'numeric',timeZone:'America/Bogota'});
    const f2=parseLocalDate(date2).toLocaleDateString('es-CO',{month:'short',day:'numeric',timeZone:'America/Bogota'});
    
    const lab=(s)=>{const d=parseLocalDate(s);return d.getDate()+' '+MESES3[d.getMonth()];};
    const dif=(x,y)=>(x!=null&&y!=null)?y-x:null;
    const avg=(m)=>(m&&m.brazo_izq_cm!=null&&m.brazo_der_cm!=null)?(m.brazo_izq_cm+m.brazo_der_cm)/2:null;
    const tile=(label,d,dec,unit)=>`<div class="cmp-tile"><div class="k">${label}</div><div class="v${d!=null&&d>0.00001?' pos':''}">${d==null?'—':signed(d,dec)+unit}</div></div>`;
    const tiles=tile('Peso',dif(pesoDe(m1),pesoDe(m2)),1,'')
      +tile('Cintura',dif(m1&&m1.abdomen_cm,m2&&m2.abdomen_cm),1,'')
      +tile('Brazos',dif(avg(m1),avg(m2)),1,'');

    let html=`
      <div class="cmp-wrap">
        <div class="cmp-head"><h3 class="card-title" style="font-size:22px;">Resultado</h3><div class="cmp-range">${lab(date1)} <span class="acc">VS</span> ${lab(date2)}</div></div>
        <div class="cmp-tiles">${tiles}</div>
        <div class="table-scroll"><table class="comparison-table">
          <tr>
            <th>Métrica</th>
            <th>${f1}</th>
            <th>${f2}</th>
            <th>Cambio</th>
          </tr>
          <tr>
            <td>Sueño</td>
            <td>${d1.sueño_horas||0}h</td>
            <td>${d2.sueño_horas||0}h</td>
            <td style="color:${(d2.sueño_horas||0)>(d1.sueño_horas||0)?'var(--green)':'var(--red)'}">${((d2.sueño_horas||0)-(d1.sueño_horas||0)).toFixed(1)}h</td>
          </tr>
          <tr>
            <td>Agua</td>
            <td>${d1.agua_ml||0}ml</td>
            <td>${d2.agua_ml||0}ml</td>
            <td style="color:${(d2.agua_ml||0)>(d1.agua_ml||0)?'var(--green)':'var(--red)'}">${((d2.agua_ml||0)-(d1.agua_ml||0))}ml</td>
          </tr>
          <tr>
            <td>Entrenamiento</td>
            <td>${d1.entrenamiento?(d1.doblete?'✓✓':'✓'):'○'}</td>
            <td>${d2.entrenamiento?(d2.doblete?'✓✓':'✓'):'○'}</td>
            <td>${d1.entrenamiento===d2.entrenamiento?'-':d2.entrenamiento?'✓':'○'}</td>
          </tr>
    `;
    
    if(m1&&m2){
      const pesoT1=m1.peso_kg||((m1.peso_grasa_kg||0)+(m1.peso_magro_kg||0));
      const pesoT2=m2.peso_kg||((m2.peso_grasa_kg||0)+(m2.peso_magro_kg||0));
      const camposComparar=[
        ['cuello_cm','Cuello',false],['hombro_cm','Hombro',false],['pecho_cm','Pecho',false],['abdomen_cm','Cintura/Abdomen',false],
        ['brazo_izq_cm','Brazo Izq',true],['brazo_der_cm','Brazo Der',true],
        ['antebrazo_izq_cm','Antebrazo Izq',true],['antebrazo_der_cm','Antebrazo Der',true],
        ['muslo_izq_cm','Muslo Izq',true],['muslo_der_cm','Muslo Der',true],
        ['pantorrilla_izq_cm','Pantorrilla Izq',true],['pantorrilla_der_cm','Pantorrilla Der',true],
        ['cadera_cm','Cadera',false]
      ];
      html+=`<tr><td colspan="4" style="font-weight:600;padding:12px;background:rgba(160,125,224,.1);">Medidas Antropométricas</td></tr>`;
      camposComparar.forEach(([k,label,subeEsBueno])=>{
        if(m1[k]==null||m2[k]==null)return;
        const mejor=subeEsBueno?(m2[k]>m1[k]):(m2[k]<m1[k]);
        html+=`
          <tr>
            <td>${label}</td>
            <td>${m1[k]}cm</td>
            <td>${m2[k]}cm</td>
            <td style="color:${mejor?'var(--green)':'var(--red)'}">${(m2[k]-m1[k]).toFixed(1)}cm</td>
          </tr>`;
      });
      html+=`
          <tr>
            <td colspan="4" style="font-weight:600;padding:12px;background:rgba(160,125,224,.1);">Composición corporal</td>
          </tr>
          <tr>
            <td>Peso total</td>
            <td>${pesoT1?pesoT1.toFixed(1):'—'}kg</td>
            <td>${pesoT2?pesoT2.toFixed(1):'—'}kg</td>
            <td style="color:${pesoT2<pesoT1?'var(--green)':'var(--red)'}">${(pesoT2-pesoT1).toFixed(1)}kg</td>
          </tr>
      `;
      if(m1.grasa_pct!=null&&m2.grasa_pct!=null){
        html+=`
          <tr>
            <td>Grasa corporal</td>
            <td>${m1.grasa_pct.toFixed(1)}%</td>
            <td>${m2.grasa_pct.toFixed(1)}%</td>
            <td style="color:${m2.grasa_pct<m1.grasa_pct?'var(--green)':'var(--red)'}">${(m2.grasa_pct-m1.grasa_pct).toFixed(2)}%</td>
          </tr>
          <tr>
            <td>Peso magro</td>
            <td>${(m1.peso_magro_kg||0).toFixed(1)}kg</td>
            <td>${(m2.peso_magro_kg||0).toFixed(1)}kg</td>
            <td style="color:${(m2.peso_magro_kg||0)>(m1.peso_magro_kg||0)?'var(--green)':'var(--red)'}">${((m2.peso_magro_kg||0)-(m1.peso_magro_kg||0)).toFixed(1)}kg</td>
          </tr>
        `;
      }
    }else if(m1||m2){
      html+=`<tr><td colspan="4" style="font-size:10px;color:var(--text-2);text-align:center;">Solo una fecha tiene medidas</td></tr>`;
    }
    
    html+=`</table></div></div>`;
    
    document.getElementById('comparison-result').innerHTML=html;
    document.getElementById('comparison-result').style.display='block';
  }catch(e){
    showToast('Error en comparación');
    console.error(e);
  }
}
